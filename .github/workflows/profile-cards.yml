name: Profile cards

on:
  schedule:
    - cron: "17 0 * * *" # every night
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "package*.json"
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Draw cards
        run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets data README.md
          git diff --cached --quiet || git commit -m "Redraw profile cards [skip ci]"
          git push
